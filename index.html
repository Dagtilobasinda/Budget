<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Ledger</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#F8F9FB;--sf:#fff;--tx:#17191C;--t2:#858B95;--pos:#269B72;--neg:#D96B6B;--ac:#6479D8;--ln:#ECEEF2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111318;--sf:#191D24;--tx:#F4F5F7;--t2:#9299A5;--ln:#262B34;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111318;--sf:#191D24;--tx:#F4F5F7;--t2:#9299A5;--ln:#262B34;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:20px 20px}
h1{font-size:15px;font-weight:500;color:var(--t2);margin:0}
.big{font-size:40px;font-weight:600;letter-spacing:-.02em;margin:2px 0 4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sec{background:var(--sf);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sec h2{font-size:14px;font-weight:600;margin:0 0 12px}
.mut{color:var(--t2);font-size:13px}.pos{color:var(--pos)}.neg{color:var(--neg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats b{display:block;font-size:17px;font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;max-width:110px;padding:8px;border-radius:12px;color:var(--t2);font-size:13px}
.nav button.on{color:var(--tx);background:var(--bg);font-weight:600}
.fab{position:fixed;right:20px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;border-radius:28px;padding:13px 20px;font-weight:600;box-shadow:0 6px 18px rgba(100,121,216,.4)}
.tx{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--ln)}
.tx:first-of-type{border-top:0}
.bar{height:6px;background:var(--ln);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:3px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:11px 12px;width:100%}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet form{background:var(--sf);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px;display:grid;gap:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px}.seg button{flex:1;padding:8px;border-radius:10px;color:var(--t2)}.seg .on{background:var(--sf);color:var(--tx);font-weight:600}
.pri{background:var(--ac);color:#fff;border-radius:12px;padding:13px;font-weight:600}
.leg{display:flex;justify-content:space-between;align-items:center;padding:6px 0;width:100%;text-align:left}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px}
.empty{text-align:center;color:var(--t2);padding:24px 0}
.link{color:var(--ac);font-size:13px}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body><main id="app"></main><div id="ui"></div>
<script>
const EXP={Housing:'#6479D8',Food:'#269B72',Transport:'#E0A458',Health:'#D96B6B',Personal:'#9C7BD0',Entertainment:'#4FA8C7',Subscriptions:'#8A93A6',Other:'#B8BEC9'};
const INC=['Salary','Freelance','Scholarship','Family support','Refunds','Other income'];
const $=s=>document.querySelector(s);
let S={tx:[],budget:{limit:0,cats:{}},cur:'EUR',theme:'auto',lastBackup:null},ym=new Date().toISOString().slice(0,7),tab='overview',selCat=null,form=null;
/* storage: IndexedDB (no cloud) */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('ledger',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(0);setTimeout(()=>rej(0),2500)});
async function load(){try{const d=await idb();const v=await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get('db');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});if(v)S={...S,...v}}catch(e){try{const v=JSON.parse(localStorage.getItem('ledger-db')||'null');if(v)S={...S,...v}}catch(x){}}}
async function save(){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(S)),'db')}catch(e){try{localStorage.setItem('ledger-db',JSON.stringify(S))}catch(x){alert('Could not save in this browser. Use Settings to download a backup.')}}}
/* money in integer minor units */
const fmt=c=>new Intl.NumberFormat(undefined,{style:'currency',currency:S.cur}).format(c/100);
const parse=s=>Math.round(parseFloat(String(s).replace(',','.'))*100);
const mTx=m=>S.tx.filter(t=>t.date.startsWith(m)).map(cv);
const sum=(a,ty)=>a.filter(t=>t.type===ty).reduce((x,t)=>x+t.amt,0);
const shift=(m,n)=>{const[y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const mLabel=m=>new Date(m+'-01T12:00').toLocaleDateString(undefined,{month:'long',year:'numeric'});
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* charts: inline SVG */
function donut(data,total){if(!data.length)return'';const R=70,C=2*Math.PI*R;let off=0;
const segs=data.map(([k,v])=>{const l=v/total*C;const s=`<circle r="${R}" cx="90" cy="90" fill="none" stroke="${EXP[k]||'#B8BEC9'}" stroke-width="${selCat===k?26:20}" stroke-dasharray="${l-2} ${C-l+2}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)" style="cursor:pointer" onclick="pick('${k}')"><title>${k}: ${fmt(v)}</title></circle>`;off+=l;return s}).join('');
return`<svg viewBox="0 0 180 180" width="190" style="display:block;margin:0 auto">${segs}<text x="90" y="86" text-anchor="middle" fill="var(--t2)" font-size="10">Spent</text><text x="90" y="104" text-anchor="middle" fill="var(--tx)" font-size="15" font-weight="600">${fmt(total)}</text></svg>`}
function bars(y){const rows=[...Array(12)].map((_,i)=>{const m=y+'-'+String(i+1).padStart(2,'0'),t=mTx(m);return[sum(t,'income'),sum(t,'expense')]});const mx=Math.max(1,...rows.flat());
return`<svg viewBox="0 0 300 120" width="100%">${rows.map((r,i)=>{const x=i*25+4,h1=r[0]/mx*95,h2=r[1]/mx*95;return`<rect x="${x}" y="${100-h1}" width="9" height="${h1}" rx="2" fill="var(--pos)"><title>Income ${fmt(r[0])}</title></rect><rect x="${x+10}" y="${100-h2}" width="9" height="${h2}" rx="2" fill="var(--neg)"><title>Expenses ${fmt(r[1])}</title></rect><text x="${x+9}" y="114" font-size="8" text-anchor="middle" fill="var(--t2)">${'JFMAMJJASOND'[i]}</text>`}).join('')}</svg>`}
function pick(k){selCat=selCat===k?null:k;render()}
/* views */
function head(){return`<div class="row"><button onclick="mv(-1)" class="mut">‹</button><h1>${mLabel(ym)}</h1><button onclick="mv(1)" class="mut">›</button></div>`}
function mv(n){ym=shift(ym,n);selCat=null;render()}
function txRow(t){return`<div class="tx"><div><div>${esc(t.title)}</div><div class="mut">${esc(t.cat)} · ${t.date}</div></div><div class="row"><span class="${t.type==='income'?'pos':''}">${t.type==='income'?'+':'−'}${fmt(t.amt)}</span><button class="mut" onclick="del('${t.id}')" aria-label="Delete">✕</button></div></div>`}
function overview(){const t=mTx(ym),inc=sum(t,'income'),ex=sum(t,'expense'),net=inc-ex,all=sum(S.tx,'income')-sum(S.tx,'expense');
const by={};t.filter(x=>x.type==='expense').forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amt);const d=Object.entries(by).sort((a,b)=>b[1]-a[1]);
const lim=S.budget.limit;const used=lim?ex/lim:0;
const shown=selCat?t.filter(x=>x.cat===selCat):t.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
return head()+`<div style="margin:22px 0 6px"><h1>Balance</h1><div class="big">${fmt(all)}</div><div class="mut">${net>=0?'<span class="pos">+':'<span class="neg">−'}${fmt(Math.abs(net))}</span> this month</div></div>
<div class="stats"><div><span class="mut">Income</span><b class="pos">${fmt(inc)}</b></div><div><span class="mut">Spent</span><b>${fmt(ex)}</b></div><div><span class="mut">Saved</span><b>${inc?Math.round(net/inc*100)+'%':'–'}</b></div></div>
${lim?`<div class="sec"><div class="row"><b>Budget</b><span class="${used>1?'neg':'mut'}">${used>1?fmt(ex-lim)+' over':fmt(lim-ex)+' left'}</span></div><div class="bar"><i style="width:${Math.min(100,used*100)}%;background:${used>=1?'var(--neg)':used>=.8?'#E0A458':'var(--ac)'}"></i></div>${used>=.5?`<div class="mut" style="margin-top:8px">${used>1?'Over budget':used>=1?'Budget reached':used>=.8?'80% of budget used':'50% of budget used'}</div>`:''}</div>`:''}
<div class="sec"><h2>Where it went</h2>${d.length?donut(d,ex)+d.map(([k,v])=>`<button class="leg" onclick="pick('${k}')"><span><i class="dot" style="background:${EXP[k]||'#B8BEC9'}"></i>${k} <span class="mut">${Math.round(v/ex*100)}%</span></span><span>${fmt(v)}</span></button>`).join(''):'<div class="empty">No spending this month.<br>Tap Add to record your first expense.</div>'}</div>
<div class="sec"><h2>${selCat?esc(selCat):'Recent'}</h2>${shown.length?shown.map(txRow).join(''):'<div class="empty">Nothing yet.</div>'}</div>
<div class="sec"><h2>Income vs expenses, ${ym.slice(0,4)}</h2>${bars(ym.slice(0,4))}</div>`}
function txs(){const t=mTx(ym).sort((a,b)=>b.date.localeCompare(a.date));return head()+`<div class="sec" style="margin-top:18px">${t.length?t.map(txRow).join(''):'<div class="empty">No transactions in this month.</div>'}</div>`}
function budgets(){const t=mTx(ym).filter(x=>x.type==='expense'),by={};t.forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amt);
return head()+`<div class="sec" style="margin-top:18px"><h2>Monthly limit</h2><input id="lim" inputmode="decimal" placeholder="e.g. 1200" value="${S.budget.limit?S.budget.limit/100:''}" onchange="setB(null,this.value)"></div>
<div class="sec"><h2>By category</h2>${Object.keys(EXP).map(k=>{const b=S.budget.cats[k]||0,a=by[k]||0,u=b?a/b:0;return`<div style="margin-bottom:14px"><div class="row"><span>${k}</span><input style="width:96px;text-align:right" inputmode="decimal" placeholder="Budget" value="${b?b/100:''}" onchange="setB('${k}',this.value)"></div><div class="row mut" style="margin-top:4px"><span>${fmt(a)} spent</span><span class="${u>1?'neg':''}">${b?(u>1?fmt(a-b)+' over':fmt(b-a)+' left'):''}</span></div>${b?`<div class="bar"><i style="width:${Math.min(100,u*100)}%;background:${u>1?'var(--neg)':'var(--ac)'}"></i></div>`:''}</div>`}).join('')}</div>`}
function setB(k,v){const c=v?parse(v):0;if(k)S.budget.cats[k]=c;else S.budget.limit=c;save();render()}
function data(){return`<div class="sec" style="margin-top:18px"><h2>Appearance & currency</h2><div style="display:grid;gap:10px"><select onchange="S.theme=this.value;save();render()">${['auto','light','dark'].map(x=>`<option ${S.theme===x?'selected':''}>${x}</option>`)}</select><select onchange="setBase(this.value)">${['EUR','TRY'].map(x=>`<option ${S.cur===x?'selected':''}>${x}</option>`)}</select></div><p class="mut">Changing currency changes display only; amounts are not converted.</p></div>
<div class="sec"><h2>Your data</h2><p class="mut">Everything stays in this browser. Clearing site data or losing the device deletes it, so back up regularly.${S.lastBackup?' Last backup: '+S.lastBackup+'.':' You have not backed up yet.'}</p>
<div style="display:grid;gap:10px"><button class="pri" onclick="exp('json')">Download backup (JSON)</button><button class="pri" style="background:var(--bg);color:var(--tx)" onclick="exp('csv')">Export transactions (CSV)</button><label class="pri" style="background:var(--bg);color:var(--tx);text-align:center;cursor:pointer">Restore backup<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label></div></div>`}
function exp(k){let b,n;if(k==='json'){b=JSON.stringify(S);n='ledger-backup.json';S.lastBackup=today();save()}else{n='transactions.csv';b='date,title,type,category,amount,currency\n'+S.tx.map(t=>[t.date,'"'+t.title.replace(/"/g,'""')+'"',t.type,t.cat,(t.amt/100).toFixed(2),tc(t)].join(',')).join('\n')}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b]));a.download=n;a.click();render()}
async function imp(f){if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.tx))throw 0;ask('Replace all current data with this backup ('+j.tx.length+' transactions)?',async()=>{S={...S,...j};await save();init();render()})}catch(e){alert('That file is not a valid Ledger backup.')}}
/* add form */
function openForm(){form={type:'expense'};sheet()}
function sheet(){const f=form,cats=f.type==='income'?INC:Object.keys(EXP);
$('#ui').innerHTML=`<div class="sheet" onclick="if(event.target===this){form=null;$('#ui').innerHTML=''}"><form onsubmit="add(event)"><div class="seg"><button type="button" class="${f.type==='expense'?'on':''}" onclick="form.type='expense';sheet()">Expense</button><button type="button" class="${f.type==='income'?'on':''}" onclick="form.type='income';sheet()">Income</button></div>
<input name="amt" inputmode="decimal" placeholder="Amount" required autofocus><input name="title" placeholder="Title" required><select name="cat">${cats.map(c=>`<option>${c}</option>`)}</select><input name="date" type="date" value="${today()}" required><button class="pri">Add transaction</button></form></div>`}
function add(e){e.preventDefault();const f=new FormData(e.target),a=parse(f.get('amt'));if(!(a>0)){alert('Enter an amount greater than zero.');return}
S.tx.push({id:crypto.randomUUID(),title:f.get('title').trim(),amt:a,type:form.type,cat:f.get('cat'),date:f.get('date'),created:Date.now()});ym=f.get('date').slice(0,7);form=null;$('#ui').innerHTML='';save();render()}
function del(id){ask('Delete this transaction?',()=>{S.tx=S.tx.filter(t=>t.id!==id);save();render()})}
function render(){const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme);
$('#app').innerHTML={overview,txs,budgets,data}[tab]();
$('#ui').innerHTML=form?$('#ui').innerHTML:`<button class="fab" onclick="openForm()">+ Add</button><nav class="nav">${[['overview','Overview'],['txs','Activity'],['budgets','Budgets'],['data','Settings']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';selCat=null;render()">${l}</button>`).join('')}</nav>`}
</script><script>
document.head.insertAdjacentHTML('beforeend','<style>.nav button{font-size:12px;padding:8px 2px}</style>');
const TY={expense:'Expense',income:'Income',transfer:'Transfer'},AT={cash:'Cash',bank:'Bank account',debit:'Debit card',savings:'Savings',card:'Credit card',loan:'Loan / debt'};
let F={q:'',ty:''};
const acc=id=>S.accts.find(a=>a.id===id)||S.accts[0];
const bal=a=>S.tx.reduce((s,t)=>s+(t.acct===a.id?(t.type==='income'?t.amt:-t.amt):0)+(t.to===a.id?(t.amt2||conv(t.amt,acur(t.acct),a.cur||S.cur)):0),a.open||0);
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function adv(s,e){const d=pd(s),day=d.getDate();if(e==='daily'){d.setDate(day+1);return ds(d)}if(e==='weekly'){d.setDate(day+7);return ds(d)}const n={monthly:1,quarterly:3,yearly:12}[e],t=new Date(d.getFullYear(),d.getMonth()+n,1);t.setDate(Math.min(day,new Date(t.getFullYear(),t.getMonth()+1,0).getDate()));return ds(t)}
function init(){S.accts=S.accts||[{id:'a0',name:'Cash',type:'cash',open:0}];S.goals=S.goals||[];S.rec=S.rec||[];S.cats=S.cats||[];S.cats.forEach(c=>EXP[c.name]=c.color);S.tx.forEach(t=>{if(!t.acct)t.acct=S.accts[0].id});if(!S.rate)S.rate={v:56.1729,date:'2026-11-05',src:'ECB'};S.accts.forEach(a=>{if(!a.cur)a.cur=S.cur})}
/* transactions: edit, duplicate, search, filter, transfers */
function txRow(t){const tr=t.type==='transfer';return`<div class="tx"><div onclick="edit('${t.id}')" style="cursor:pointer"><div>${esc(t.title)}</div><div class="mut">${tr?esc(acc(t.acct).name)+' → '+esc(acc(t.to).name):esc(t.cat)+(t.sub?' / '+esc(t.sub):'')+' · '+esc(acc(t.acct).name)} · ${t.date}</div></div><div class="row"><span class="${t.type==='income'?'pos':''}">${t.type==='income'?'+':tr?'':'−'}${fmt(t.amt)}</span><button class="mut" onclick="dup('${t.id}')" aria-label="Duplicate">⧉</button><button class="mut" onclick="del('${t.id}')" aria-label="Delete">✕</button></div></div>`}
function openForm(t){form=t?{...t,v:{...t,amt:t.amt/100}}:{type:'expense',v:{}};sheet()}
function edit(id){openForm(S.tx.find(t=>t.id===id))}
function dup(id){const t=S.tx.find(x=>x.id===id);S.tx.push({...t,id:crypto.randomUUID(),rk:undefined,date:today(),created:Date.now()});save();render()}
function setType(t){form.v=Object.fromEntries(new FormData($('.sheet form')));form.type=t;sheet()}
function sheet(){const f=form,v=f.v||{},tr=f.type==='transfer',cats=f.type==='income'?INC:Object.keys(EXP),op=(l,s)=>l.map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join(''),ao=s=>S.accts.map(a=>`<option value="${a.id}" ${a.id===s?'selected':''}>${esc(a.name)}</option>`).join('');
$('#ui').innerHTML=`<div class="sheet" onclick="if(event.target===this){form=null;render()}"><form onsubmit="add(event)"><div class="seg">${Object.keys(TY).map(k=>`<button type="button" class="${f.type===k?'on':''}" onclick="setType('${k}')">${TY[k]}</button>`).join('')}</div><input name="amt" inputmode="decimal" placeholder="Amount" required value="${v.amt||''}"><input name="title" placeholder="Title" required value="${esc(v.title||'')}">${tr?`<select name="acct">${ao(v.acct)}</select><select name="to">${ao(v.to||(S.accts[1]||{}).id)}</select>`:`<select name="cat">${op(cats,v.cat)}</select><input name="sub" placeholder="Subcategory (optional)" value="${esc(v.sub||'')}"><select name="acct">${ao(v.acct)}</select>`}<input name="date" type="date" required value="${v.date||today()}"><button class="pri">${f.id?'Save changes':'Add transaction'}</button></form></div>`}
function add(e){e.preventDefault();const f=new FormData(e.target),a=parse(f.get('amt'));if(!(a>0)){alert('Enter an amount greater than zero.');return}const tr=form.type==='transfer';if(tr&&f.get('acct')===f.get('to')){alert('Choose two different accounts.');return}
const o={title:f.get('title').trim(),amt:a,type:form.type,cat:tr?'Transfer':f.get('cat'),sub:f.get('sub')||'',acct:f.get('acct'),date:f.get('date'),to:tr?f.get('to'):undefined};
if(form.id){const i=S.tx.findIndex(t=>t.id===form.id);S.tx[i]={...S.tx[i],...o,updated:Date.now()}}else S.tx.push({...o,id:crypto.randomUUID(),created:Date.now()});ym=o.date.slice(0,7);form=null;save();render()}
function lstH(){const q=F.q.toLowerCase(),t=mTx(ym).filter(x=>(!F.ty||x.type===F.ty)&&(!q||(x.title+x.cat+(x.sub||'')).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));return t.length?t.map(txRow).join(''):'<div class="empty">No matching transactions.</div>'}
function lst(){$('#lst').innerHTML=lstH()}
function txs(){return head()+`<div class="sec" style="margin-top:18px"><div style="display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:8px"><input placeholder="Search" value="${esc(F.q)}" oninput="F.q=this.value;lst()"><select onchange="F.ty=this.value;lst()"><option value="">All</option>${Object.keys(TY).map(k=>`<option value="${k}" ${F.ty===k?'selected':''}>${TY[k]}</option>`).join('')}</select></div><div id="lst">${lstH()}</div></div>`}
/* overview: net worth + estimate */
const ov0=overview;
overview=function(){const nw=S.accts.reduce((s,a)=>s+balB(a),0);return ov0().replace(/<div class="big">.*?<\/div>/,`<div class="big">${fmt(nw)}</div>`).replace('<h1>Balance</h1>','<h1>Net worth</h1>')+forecast()};

L.forEach(l=>{if(!l.trim())return;const[d,ti,ty,c,a,cu]=cells(l),amt=parse(a);if(!/^\d{4}-\d\d-\d\d$/.test(d)||!['income','expense'].includes(ty)||!(amt>0)||!ti){sk++;return}const k=[d,ti,ty,amt].join('|');if(have.has(k)){sk++;return}have.add(k);S.tx.push({id:crypto.randomUUID(),title:ti.trim(),amt,type:ty,cat:(EXP[c]||INC.includes(c))?c:(ty==='income'?'Other income':'Other'),sub:'',acct:(S.accts.find(x=>(x.cur||S.cur)===(cu||'').trim())||S.accts[0]).id,date:d,created:Date.now()});n++});
await save();render();ask('Imported '+n+' transactions. Skipped '+sk+' (duplicates or invalid rows).',()=>{})}

/* multi-currency: EUR and TRY accounts, manual rate, per-account display */
const CUR=['EUR','TRY'];
function acur(id){const a=S.accts.find(x=>x.id===id)||S.accts[0];return a.cur||S.cur}
function tc(t){return acur(t.acct)}
function conv(c,from,to){if(from===to)return c;const r=S.rate&&S.rate.v;if(!r)return c;return from==='EUR'&&to==='TRY'?Math.round(c*r):from==='TRY'&&to==='EUR'?Math.round(c/r):c}
const toBase=(c,cur)=>conv(c,cur,S.cur);
function cv(t){const c=tc(t);return{...t,amt:toBase(t.amt,c),_o:t.amt,_c:c}}
const balB=a=>toBase(bal(a),a.cur||S.cur);
const fmtC=(c,cur)=>new Intl.NumberFormat(undefined,{style:'currency',currency:cur}).format(c/100);
const tr0=txRow;txRow=function(t){const h=tr0(t);return t._c&&t._c!==S.cur?h.replace(fmt(t.amt),fmtC(t._o,t._c)):h};
function rateChip(){const r=S.rate||{},d=r.date?Math.floor((new Date(today()+'T12:00')-new Date(r.date+'T12:00'))/864e5):99;
return`<div class="sec" style="padding:12px 14px"><div class="row"><button style="text-align:left" onclick="rateEdit()"><b>1 € = ₺${(r.v||0).toFixed(2)}</b><div class="mut" style="${d>3?'color:var(--neg)':''}">${r.src||'Manual'} · ${r.date||'not set'}${d>3&&d<99?' · '+d+' days old':''} · tap to update</div></button><div class="seg" style="width:100px">${CUR.map(c=>`<button class="${S.cur===c?'on':''}" onclick="setBase('${c}')">${c==='EUR'?'€':'₺'}</button>`).join('')}</div></div></div>`}
function rateEdit(){ask('Today’s rate: how many TRY for 1 EUR?',v=>{const x=parseFloat(String(v).replace(',','.'));if(!(x>1))return alert('Enter a valid rate, for example 56.20.');S.rate={v:x,date:today(),src:'Manual'};save();render()},1)}
function setBase(c){if(c===S.cur)return;ask('Show everything in '+c+'? Budgets and goals will be converted at the saved rate.',()=>{const f=x=>conv(x||0,S.cur,c);S.budget.limit=f(S.budget.limit);Object.keys(S.budget.cats).forEach(k=>S.budget.cats[k]=f(S.budget.cats[k]));S.goals.forEach(g=>{g.target=f(g.target);g.saved=f(g.saved)});S.cur=c;save();render()})}
const ov2=overview;overview=function(){return rateChip()+ov2()};

try{if(!crypto.randomUUID)crypto.randomUUID=()=>'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}catch(e){}
